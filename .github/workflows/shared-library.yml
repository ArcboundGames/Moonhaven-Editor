name: Shared Library

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - SharedLibrary/**
      - Editor/src/**
      - .github/workflows/shared-library.yml
  pull_request:
    branches: [main]
    paths:
      - SharedLibrary/**
      - Editor/src/**
      - .github/workflows/shared-library.yml

concurrency:
  group: shared-library-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: SharedLibrary/package-lock.json
      - name: Use npm 11
        run: npm install -g npm@11
      - name: Install
        working-directory: ./SharedLibrary
        run: npm ci
      - name: Discover tests
        working-directory: ./SharedLibrary
        run: |
          count=$(npx jest --listTests | wc -l)
          echo "Discovered $count tests"
          test "$count" -gt 0
      - name: Check
        working-directory: ./SharedLibrary
        run: npm run check
      - name: Editor type-check
        working-directory: ./Editor
        run: |
          npm ci --ignore-scripts
          npm run type-check
